<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お礼ハガキ訪問リスト - ヤハタ電機商会</title>
<style>
  :root {
    --navy: #1a3a5c; --navy-deep: #12283f; --blue: #2e75b6; --sun: #f0a500;
    --paper: #f4f7fa; --card: #ffffff; --ink: #1c2530; --ink-soft: #4a5a6a;
    --line: #d7e0e8; --done: #8fbf6f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#10161d; --card:#1a2028; --ink:#e8edf2; --ink-soft:#a9b6c2;
            --line:#2c3844; --navy:#3f6a94; --navy-deep:#1a3a5c; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* ===== PINロック ===== */
  #pinGate { position: fixed; inset: 0; z-index: 9999; background: var(--paper);
             display: flex; align-items: center; justify-content: center; padding: 20px; }
  #pinGate.hidden { display: none; }
  #pinGate .pinbox { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
                     padding: 30px 28px; text-align: center; max-width: 320px; width: 100%;
                     box-shadow: 0 6px 24px rgba(0,0,0,0.12); }
  #pinGate .pin-emoji { font-size: 34px; }
  #pinGate .pin-title { font-weight: 700; font-size: 16px; margin: 8px 0 2px; }
  #pinGate .pin-sub { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 16px; }
  #pinGate input { font-family: inherit; font-size: 24px; letter-spacing: .35em; text-align: center;
                   padding: 10px 8px; width: 170px; border: 1px solid var(--line);
                   border-radius: 10px; background: var(--paper); color: var(--ink); }
  #pinGate .pin-err { color: #e8654f; font-size: 12px; height: 16px; margin: 6px 0; }
  #pinGate button { font-family: inherit; font-size: 15px; font-weight: 700; margin-top: 6px;
                    padding: 10px 28px; border: none; border-radius: 8px;
                    background: var(--blue); color: #fff; }

  /* ===== ヘッダー ===== */
  header { background: var(--navy); color: #fff; padding: 16px 16px 14px; position: sticky; top: 0; z-index: 50; }
  header h1 { margin: 0; font-size: 17px; letter-spacing: .04em; }
  header .sub { font-size: 11.5px; opacity: .78; margin-top: 3px; }
  .counts { display: flex; gap: 8px; margin-top: 11px; }
  .count { flex: 1; background: rgba(255,255,255,.12); border-radius: 8px; padding: 7px 4px; text-align: center; }
  .count b { display: block; font-size: 19px; line-height: 1.15; }
  .count span { font-size: 10.5px; opacity: .8; }

  /* ===== 区フィルタ ===== */
  .filters { display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px;
             background: var(--card); border-bottom: 1px solid var(--line);
             position: sticky; top: 108px; z-index: 40; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; font-size: 13px; font-family: inherit; padding: 6px 13px;
          border-radius: 999px; border: 1px solid var(--line); background: var(--paper);
          color: var(--ink-soft); white-space: nowrap; }
  .chip.on { background: var(--navy); color: #fff; border-color: var(--navy); font-weight: 700; }

  /* ===== リスト ===== */
  main { padding: 12px 12px 90px; max-width: 720px; margin: 0 auto; }
  .daygroup { margin-bottom: 18px; }
  .dayhead { font-size: 12px; font-weight: 700; color: var(--ink-soft);
             letter-spacing: .08em; padding: 0 2px 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 11px;
          padding: 12px 13px; margin-bottom: 9px; }
  .card.done { opacity: .45; }
  .row1 { display: flex; align-items: center; gap: 8px; }
  .ku { flex: 0 0 auto; font-size: 19px; line-height: 1; color: var(--sun); }
  .rfm { flex: 0 0 auto; font-size: 11px; font-weight: 700; line-height: 1;
         padding: 3px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--ink-soft); }
  .rfm.a { background: #f0a500; border-color: #f0a500; color: #fff; }
  .rfm.b { background: #fdf0d0; border-color: #e8c98a; color: #8a6100; }
  .nm { font-size: 16px; font-weight: 700; flex: 1; min-width: 0; }
  .work { font-size: 12.5px; color: var(--ink-soft); margin: 6px 0 0; line-height: 1.5; }
  .addr { font-size: 13.5px; margin: 7px 0 0; line-height: 1.5; }
  .addr a { color: var(--blue); text-decoration: none; }
  .warn { color: #d9534f; font-weight: 700; }
  .acts { display: flex; gap: 7px; margin-top: 11px; }
  .acts a, .acts button {
    font-family: inherit; font-size: 13px; font-weight: 700; padding: 9px 0;
    border-radius: 8px; border: 1px solid var(--line); background: var(--paper);
    color: var(--ink); text-decoration: none; text-align: center; flex: 1;
  }
  .acts .primary { background: var(--done); border-color: var(--done); color: #fff; flex: 1.3; }
  .acts .primary:disabled { opacity: .5; }
  .empty { text-align: center; color: var(--ink-soft); padding: 50px 20px; font-size: 14px; line-height: 1.8; }
  .loading { text-align: center; padding: 50px 20px; color: var(--ink-soft); font-size: 14px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
           background: var(--navy-deep); color: #fff; padding: 11px 20px; border-radius: 999px;
           font-size: 13.5px; z-index: 200; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: .96; }
  .refresh { position: fixed; right: 16px; bottom: 20px; z-index: 60;
             width: 52px; height: 52px; border-radius: 50%; border: none;
             background: var(--blue); color: #fff; font-size: 21px;
             box-shadow: 0 4px 14px rgba(0,0,0,.28); }
</style>
</head>
<body>

<div id="pinGate">
  <div class="pinbox">
    <div class="pin-emoji">🌻</div>
    <p class="pin-title">お礼ハガキ訪問リスト</p>
    <p class="pin-sub">4桁のPINを入力してください</p>
    <input id="pinInput" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
    <div class="pin-err" id="pinErr"></div>
    <button type="button" onclick="checkPin()">入る</button>
  </div>
</div>

<header>
  <h1>🌻 お礼ハガキ訪問リスト</h1>
  <div class="sub">工事・配達が終わったお客様です。ハガキを持って伺いましょう。</div>
  <div class="counts">
    <div class="count"><b id="cAll">–</b><span>未訪問</span></div>
    <div class="count"><b id="cWeek">–</b><span>今週の分</span></div>
    <div class="count"><b id="cOld">–</b><span>2週間以上前</span></div>
  </div>
</header>

<div class="filters" id="filters"></div>

<main>
  <div class="loading" id="list">読み込んでいます…</div>
</main>

<button class="refresh" onclick="load(true)" title="最新にする">↻</button>
<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwDhQVpdoB_Dt92NXiCXHFHREWf8O1EVU8jY_YyHtPH8wg7pB4INrcf7bTnN0QN-TAL/exec';
const CACHE_KEY = 'hagaki_list_v1';
let DATA = [];
let filterKu = '';

/* ===== PIN ===== */
const PIN = '7860', PKEY = 'hagaki_pin_ok';
function checkPin() {
  const v = (document.getElementById('pinInput').value || '').trim();
  if (v === PIN) { try { localStorage.setItem(PKEY, '1'); } catch (e) {} reveal(); }
  else { document.getElementById('pinErr').textContent = 'PINが違います'; }
}
function reveal() { document.getElementById('pinGate').classList.add('hidden'); load(); }
document.getElementById('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPin(); });
try { if (localStorage.getItem(PKEY) === '1') reveal(); } catch (e) {}

/* ===== 読み込み ===== */
function load(force) {
  if (!force) {
    try {
      const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (c && Date.now() - c.t < 30 * 60 * 1000) { DATA = c.d; render(); }
    } catch (e) {}
  }
  if (!DATA.length) document.getElementById('list').innerHTML =
    '<div class="loading">読み込んでいます…<br><small>初回は少し時間がかかります</small></div>';

  fetch(API + '?action=hagaki&t=' + Date.now())
    .then(r => r.json())
    .then(d => {
      DATA = d;
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {}
      render();
      if (force) toast('最新にしました');
    })
    .catch(() => {
      if (!DATA.length) document.getElementById('list').innerHTML =
        '<div class="empty">読み込めませんでした。<br>電波の良いところで ↻ を押してください。</div>';
    });
}

/* ===== 描画 ===== */
function daysAgo(dateLabel) {
  const m = String(dateLabel).match(/^(\d+)\/(\d+)/);
  if (!m) return 0;
  const now = new Date();
  let y = now.getFullYear();
  let d = new Date(y, Number(m[1]) - 1, Number(m[2]));
  if (d - now > 86400000 * 30) d = new Date(y - 1, Number(m[1]) - 1, Number(m[2]));
  return Math.floor((now - d) / 86400000);
}

function render() {
  const list = document.getElementById('list');

  document.getElementById('cAll').textContent = DATA.length;
  document.getElementById('cWeek').textContent = DATA.filter(x => daysAgo(x.date) <= 7).length;
  document.getElementById('cOld').textContent = DATA.filter(x => daysAgo(x.date) > 14).length;

  /* 区のチップ */
  const kus = [];
  DATA.forEach(x => { if (x.ku && kus.indexOf(x.ku) < 0) kus.push(x.ku); });
  kus.sort();
  const hasNoKu = DATA.some(x => !x.ku);
  let chips = '<button class="chip' + (filterKu === '' ? ' on' : '') + '" onclick="setKu(\'\')">すべて</button>';
  kus.forEach(k => {
    const n = DATA.filter(x => x.ku === k).length;
    chips += '<button class="chip' + (filterKu === k ? ' on' : '') + '" onclick="setKu(\'' + k + '\')">' + k + ' ' + n + '</button>';
  });
  if (hasNoKu) {
    const n = DATA.filter(x => !x.ku).length;
    chips += '<button class="chip' + (filterKu === '?' ? ' on' : '') + '" onclick="setKu(\'?\')">区なし ' + n + '</button>';
  }
  const nA = DATA.filter(x => x.rfm === 'A').length;
  if (nA) chips += '<button class="chip' + (filterKu === 'A' ? ' on' : '') + '" onclick="setKu(\'A\')">⭐Aランク ' + nA + '</button>';
  document.getElementById('filters').innerHTML = chips;

  /* 絞り込み */
  const rows = DATA.filter(x =>
    filterKu === '' ? true :
    filterKu === 'A' ? x.rfm === 'A' :
    filterKu === '?' ? !x.ku : x.ku === filterKu);
  if (!rows.length) {
    list.innerHTML = '<div class="empty">未訪問はありません。<br>お疲れさまでした 🌻</div>';
    return;
  }

  /* 日付でまとめる */
  const groups = [];
  rows.forEach(x => {
    let g = groups.find(g => g.date === x.date);
    if (!g) { g = { date: x.date, items: [] }; groups.push(g); }
    g.items.push(x);
  });

  list.className = '';
  list.innerHTML = groups.map(g => {
    const ago = daysAgo(g.date);
    const agoTxt = ago === 0 ? '今日' : ago === 1 ? '昨日' : ago + '日前';
    return '<div class="daygroup"><div class="dayhead">' + esc(g.date) + '　･　' + agoTxt +
           '　（' + g.items.length + '件）</div>' + g.items.map(card).join('') + '</div>';
  }).join('');
}

function card(x) {
  const bad = x.address.indexOf('⚠') >= 0;
  const mapQ = encodeURIComponent(x.address.replace(/⚠️.*/, '') || x.name);
  return '<div class="card" id="c-' + esc(x.key) + '">' +
    '<div class="row1">' +
      (x.ku ? '<span class="ku">' + x.ku + '</span>' : '') +
      '<span class="nm">' + esc(x.name) + '</span>' +
      (x.rfm ? '<span class="rfm ' + esc(x.rfm.toLowerCase()) + '">' + esc(x.rfm) + '</span>' : '') +
    '</div>' +
    '<p class="work">' + esc(x.work) + '　<span style="opacity:.7">/ ' + esc(x.staff) + '</span></p>' +
    '<p class="addr' + (bad ? ' warn' : '') + '">' +
      (bad ? esc(x.address) + '<br><small style="font-weight:400">お客様台帳で住所をご確認ください</small>'
           : '<a href="https://www.google.com/maps/search/?api=1&query=' + mapQ + '" target="_blank" rel="noopener">' + esc(x.address) + '</a>') +
    '</p>' +
    '<div class="acts">' +
      (x.tel ? '<a href="tel:' + esc(x.tel.replace(/[^0-9]/g, '')) + '">☎ 電話</a>' : '') +
      (bad ? '' : '<a href="https://www.google.com/maps/search/?api=1&query=' + mapQ + '" target="_blank" rel="noopener">🗺 地図</a>') +
      '<button class="primary" onclick="done(this,\'' + esc(x.key) + '\')">✓ 訪問済</button>' +
    '</div>' +
  '</div>';
}

function setKu(k) { filterKu = k; render(); window.scrollTo(0, 0); }

function done(btn, key) {
  btn.disabled = true;
  btn.textContent = '送信中…';
  // GASのPOSTは返事を読めない(CORS)ので no-cors で送りっぱなしにする
  fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'hagakiDone', key: key }) })
    .then(() => {
      DATA = DATA.filter(x => x.key !== key);
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), d: DATA })); } catch (e) {}
      const el = document.getElementById('c-' + key);
      if (el) { el.classList.add('done'); setTimeout(render, 350); } else render();
      toast('訪問済にしました 🌻');
    })
    .catch(() => { btn.disabled = false; btn.textContent = '✓ 訪問済'; toast('送信できませんでした'); });
}

let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2200);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
</script>
</body>
</html>
