<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>日報｜ヤハタ電機商会</title>
<style>
  :root{--navy:#1a3a5c;--navy-deep:#12283f;--paper:#f4f7fa;--card:#fff;--ink:#1c2530;--ink-soft:#4a5a6a;--line:#d7e0e8;}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#10161d;--card:#1a2028;--ink:#e8edf2;--ink-soft:#a9b6c2;--line:#2c3844;--navy:#3f6a94;--navy-deep:#1a3a5c;}}
  :root[data-theme="dark"]{--paper:#10161d;--card:#1a2028;--ink:#e8edf2;--ink-soft:#a9b6c2;--line:#2c3844;--navy:#3f6a94;--navy-deep:#1a3a5c;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Yu Gothic Medium","Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;line-height:1.7;padding:28px 16px 70px;}
  .wrap{max-width:900px;margin:0 auto;}
  .back{display:inline-block;font-size:13px;padding:8px 16px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;margin-bottom:16px;}
  .head{background:linear-gradient(135deg,#1f5f4a 0%,#123d31 100%);color:#fff;border-radius:10px;padding:26px 30px 24px;}
  .head p{font-size:12px;letter-spacing:.14em;color:rgba(255,255,255,.72);margin:0 0 6px;}
  .head h1{font-size:23px;margin:0;}
  .sec{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--ink-soft);margin:30px 0 12px;padding-left:11px;border-left:3px solid #f0a500;}
  .sec small{font-weight:400;letter-spacing:0;margin-left:6px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
  .item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06);transition:box-shadow .18s,transform .18s;}
  .item:hover{box-shadow:0 4px 14px rgba(0,0,0,.11);transform:translateY(-1px);}
  .item .ic{font-size:24px;line-height:1;}
  .item b{display:block;font-size:14.5px;}
  .item span{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .item.card{border-style:dashed;}
  .role{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle;}
  .role.h{background:#e8f5e9;color:#2e7d32;} .role.m{background:#e4eefa;color:#164a7a;}
  .cbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .cbox .h{width:100%;font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:2px;}
  .cbox a{font-size:13px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--paper);}
  .cbox a:hover{border-color:#2e75b6;color:#2e75b6;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="manual.html">&larr; ポータルへ戻る</a>
  <div class="head"><p>ヤハタ電機商会　現場サポート</p><h1>📝 日報</h1></div>

  <!-- 中身 -->
  <p class="sec">📝 日報</p>
  <div class="grid">
      <a class="item" href="juchu.html"><span class="ic">📞</span><span><b>受注日報</b><span>全員。ご依頼を承ったら入力（電話は事務・高山。訪問中やこちらから電話したときも）</span></span></a>
      <a class="item" href="index.html"><span class="ic">🌻</span><span><b>ひまわり日報</b><span>ひまわり。区域・面談件数・ポスティング数</span></span></a>
      <a class="item" href="kouji.html"><span class="ic">📝</span><span><b>業務日報</b><span>サービス・工事。現調・配達・工事・修理・点検など。写真もここから</span></span></a>
  </div>

  <p class="sec">📘 入力マニュアル</p>
  <div class="grid">
      <a class="item" href="nippo-juchu-manual.html"><span class="ic">📞</span><span><b>受注日報の入力マニュアル</b><span>お客様・サービス・訪問日時。カレンダーに入る条件</span></span></a>
      <a class="item" href="nippo-himawari-manual.html"><span class="ic">🌻</span><span><b>ひまわり日報の入力マニュアル</b><span>区域・件数・配布物</span></span></a>
      <a class="item" href="nippo-manual.html"><span class="ic">📘</span><span><b>業務日報の入力マニュアル</b><span>作業内容ごとの入力項目と必須チェック</span></span></a>
  </div>
  <!-- /中身 -->
</div>
</body>
</html>
