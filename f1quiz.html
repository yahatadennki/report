<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1ドライバー 目もと当てクイズ</title>
<style>
  :root{ --bg:#0b0e14; --card:#151a23; --card2:#1d2531; --line:#2a3340; --ink:#eaf0f7; --muted:#8a95a6; --red:#e10600; --grn:#22c55e; --amber:#f5a623; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic Medium","Hiragino Kaku Gothic ProN",system-ui,sans-serif;padding:14px 12px 60px;}
  .wrap{max-width:560px;margin:0 auto;}
  .head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .head .logo{background:var(--red);color:#fff;font-weight:900;letter-spacing:.05em;padding:4px 10px;border-radius:6px;font-size:15px;}
  .head h1{font-size:17px;margin:0;font-weight:800;}
  .tabs{display:flex;gap:6px;margin-bottom:14px;}
  .tab{flex:1;padding:10px 0;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:9px;font-weight:800;cursor:pointer;font-family:inherit;font-size:14px;}
  .tab.on{background:var(--ink);color:#0b0e14;border-color:var(--ink);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;}
  .btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;}
  .btn.red{background:var(--red);color:#fff;} .btn.gray{background:var(--card2);color:var(--ink);border:1px solid var(--line);}
  .muted{color:var(--muted);font-size:13px;}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;}
  select,input[type=text]{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0c1017;color:var(--ink);font-size:14px;font-family:inherit;}
  input[type=range]{width:100%;}

  /* crop */
  .cropbox{position:relative;width:100%;background:#000;border-radius:10px;overflow:hidden;margin-top:6px;}
  .cropbox img{width:100%;display:block;opacity:.45;}
  .band{position:absolute;left:0;right:0;border-top:2px solid var(--amber);border-bottom:2px solid var(--amber);box-shadow:0 0 0 2000px rgba(0,0,0,.0);overflow:hidden;}
  .band img{position:absolute;left:0;width:100%;opacity:1;}
  .hint{font-size:12px;color:var(--muted);text-align:center;margin-top:6px;}

  .qlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .qchip{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;}
  .qchip img{width:44px;height:20px;object-fit:cover;border-radius:3px;}
  .qchip .del{color:var(--red);cursor:pointer;font-weight:900;}

  /* play */
  .qimg{width:100%;border-radius:12px;border:1px solid var(--line);display:block;background:#000;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
  .opt{padding:14px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}
  .opt.correct{background:rgba(34,197,94,.25);border-color:var(--grn);}
  .opt.wrong{background:rgba(225,6,0,.25);border-color:var(--red);}
  .scorebar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px;}
  .result{text-align:center;padding:24px 10px;}
  .result .big{font-size:34px;font-weight:900;}
  .empty{text-align:center;color:var(--muted);padding:30px 0;}
</style>

<div class="wrap">
  <div class="head"><span class="logo">F1</span><h1>ドライバー 目もと当てクイズ</h1></div>
  <div class="tabs">
    <button class="tab on" id="tabPlay" onclick="show('play')">▶ プレイ</button>
    <button class="tab" id="tabEdit" onclick="show('edit')">✏ 問題を作る</button>
  </div>

  <!-- プレイ -->
  <div id="view-play">
    <div id="playArea"></div>
  </div>

  <!-- 作成 -->
  <div id="view-edit" style="display:none">
    <div class="card">
      <div style="font-weight:800;margin-bottom:8px;">① 目もと写真を作る</div>
      <label>ドライバーの顔写真を選ぶ</label>
      <input type="file" id="file" accept="image/*">
      <div id="cropWrap" style="display:none">
        <label>目もとの位置を合わせる（帯をスライドで上下）</label>
        <div class="cropbox" id="cropbox">
          <img id="baseImg">
          <div class="band" id="band"><img id="bandImg"></div>
        </div>
        <input type="range" id="posRange" min="0" max="100" value="40">
        <div class="hint">帯の中が問題の「目もと」になります</div>
      </div>
      <label>② 正解のドライバー</label>
      <select id="answerSel"></select>
      <input type="text" id="answerFree" placeholder="一覧にない場合はここに入力" style="margin-top:6px">
      <button class="btn red" style="margin-top:14px" onclick="saveQ()">問題を保存する</button>
      <div id="editMsg" class="muted" style="margin-top:8px"></div>

      <div class="qlist" id="qlist"></div>
    </div>
    <div class="card">
      <div class="muted">作った問題はこの端末に保存されます。プレイタブで出題されます。</div>
      <button class="btn gray" style="margin-top:10px" onclick="clearAll()">全部の問題を削除</button>
    </div>
  </div>
</div>

<script>
  var DRIVERS = ['フェルスタッペン','ハミルトン','ルクレール','ノリス','サインツ','ラッセル','ピアストリ','アロンソ','ペレス','ガスリー','オコン','アルボン','角田','リカルド','ボッタス','周冠宇','マグヌッセン','ヒュルケンベルグ','ストロール','アントネッリ','ローソン','ベアマン','ハジャル','コラピント'];
  var KEY='f1EyeQuiz_v1';
  var Q=[]; try{ Q=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ Q=[]; }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(Q)); }catch(e){} }

  function show(v){
    document.getElementById('view-play').style.display = v==='play'?'':'none';
    document.getElementById('view-edit').style.display = v==='edit'?'':'none';
    document.getElementById('tabPlay').classList.toggle('on', v==='play');
    document.getElementById('tabEdit').classList.toggle('on', v==='edit');
    if(v==='play') startPlay(); if(v==='edit') renderQList();
  }

  // ---- 作成：目もとクロップ ----
  var BAND=0.24; // 帯の高さ（画像比）
  var curDataURL=null, natW=0, natH=0;
  var sel=document.getElementById('answerSel');
  DRIVERS.forEach(function(d){ var o=document.createElement('option'); o.value=d; o.textContent=d; sel.appendChild(o); });

  document.getElementById('file').addEventListener('change', function(e){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      curDataURL=r.result;
      var img=new Image();
      img.onload=function(){
        natW=img.naturalWidth; natH=img.naturalHeight;
        document.getElementById('baseImg').src=curDataURL;
        document.getElementById('bandImg').src=curDataURL;
        document.getElementById('cropWrap').style.display='';
        setTimeout(updateBand,50);
      };
      img.src=curDataURL;
    };
    r.readAsDataURL(f);
  });
  document.getElementById('posRange').addEventListener('input', updateBand);
  function updateBand(){
    var box=document.getElementById('cropbox'); var W=box.clientWidth; var H=box.clientHeight; if(!H) return;
    var pos=document.getElementById('posRange').value/100; // 0..1 上端
    var bandH=H*BAND;
    var top=pos*(H-bandH);
    var band=document.getElementById('band');
    band.style.top=top+'px'; band.style.height=bandH+'px';
    var bi=document.getElementById('bandImg');
    bi.style.top=(-top)+'px'; bi.style.height=H+'px';
  }
  function saveQ(){
    var msg=document.getElementById('editMsg');
    if(!curDataURL){ msg.textContent='写真を選んでください'; return; }
    var ans=(document.getElementById('answerFree').value.trim()) || sel.value;
    if(!ans){ msg.textContent='正解ドライバーを選んでください'; return; }
    var pos=document.getElementById('posRange').value/100;
    var top=pos*(natH-natH*BAND), h=natH*BAND;
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas'); c.width=natW; c.height=Math.round(h);
      c.getContext('2d').drawImage(img,0,top,natW,h,0,0,natW,h);
      var eye=c.toDataURL('image/jpeg',0.82);
      Q.push({img:eye, ans:ans}); save();
      msg.textContent='✓ 保存しました（現在 '+Q.length+'問）';
      document.getElementById('file').value=''; document.getElementById('answerFree').value='';
      document.getElementById('cropWrap').style.display='none'; curDataURL=null;
      renderQList();
    };
    img.src=curDataURL;
  }
  function renderQList(){
    var el=document.getElementById('qlist'); el.innerHTML='';
    Q.forEach(function(q,i){
      var d=document.createElement('div'); d.className='qchip';
      d.innerHTML='<img src="'+q.img+'"><span>'+q.ans+'</span><span class="del" onclick="delQ('+i+')">✕</span>';
      el.appendChild(d);
    });
  }
  window.delQ=function(i){ Q.splice(i,1); save(); renderQList(); };
  function clearAll(){ if(confirm('全部の問題を削除しますか？')){ Q=[]; save(); renderQList(); } };

  // ---- プレイ ----
  var order=[], idx=0, score=0, answered=false;
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a; }
  function startPlay(){
    var area=document.getElementById('playArea');
    if(Q.length<1){ area.innerHTML='<div class="card empty">まだ問題がありません。<br>「✏ 問題を作る」で目もと写真を追加してください。</div>'; return; }
    order=shuffle(Q.map(function(_,i){return i;})); idx=0; score=0; answered=false; renderQ();
  }
  function renderQ(){
    var area=document.getElementById('playArea');
    if(idx>=order.length){
      area.innerHTML='<div class="card result"><div class="muted">結果</div><div class="big">'+score+' / '+order.length+'</div><button class="btn red" style="margin-top:16px" onclick="startPlay()">もう一度</button></div>';
      return;
    }
    var q=Q[order[idx]];
    var wrongs=shuffle(DRIVERS.filter(function(d){return d!==q.ans;})).slice(0,3);
    var opts=shuffle([q.ans].concat(wrongs));
    var html='<div class="card"><div class="scorebar"><span>第'+(idx+1)+'問 / '+order.length+'</span><span>スコア '+score+'</span></div>';
    html+='<img class="qimg" src="'+q.img+'"><div class="opts">';
    opts.forEach(function(o){ html+='<button class="opt" data-ans="'+o+'" onclick="answer(this)">'+o+'</button>'; });
    html+='</div><div id="feedback" style="text-align:center;margin-top:12px;font-weight:800;"></div>';
    html+='<button class="btn gray" id="nextBtn" style="margin-top:10px;display:none" onclick="next()">次へ →</button></div>';
    area.innerHTML=html; answered=false;
  }
  window.answer=function(btn){
    if(answered) return; answered=true;
    var q=Q[order[idx]]; var chosen=btn.getAttribute('data-ans');
    document.querySelectorAll('.opt').forEach(function(b){
      var a=b.getAttribute('data-ans');
      if(a===q.ans) b.classList.add('correct');
      else if(a===chosen) b.classList.add('wrong');
      b.style.pointerEvents='none';
    });
    var fb=document.getElementById('feedback');
    if(chosen===q.ans){ score++; fb.textContent='⭕ 正解！ '+q.ans; fb.style.color='#22c55e'; }
    else { fb.textContent='❌ 正解は '+q.ans; fb.style.color='#e10600'; }
    document.getElementById('nextBtn').style.display='';
  };
  window.next=function(){ idx++; renderQ(); };

  startPlay();
</script>
