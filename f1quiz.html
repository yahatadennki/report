<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1ドライバー 目もと当てクイズ</title>
<style>
  :root{ --bg:#0b0e14; --card:#151a23; --card2:#1d2531; --line:#2a3340; --ink:#eaf0f7; --muted:#8a95a6; --red:#e10600; --grn:#22c55e; --amber:#f5a623; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic Medium","Hiragino Kaku Gothic ProN",system-ui,sans-serif;padding:16px 12px 40px;}
  .wrap{max-width:520px;margin:0 auto;}
  .head{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .head .logo{background:var(--red);color:#fff;font-weight:900;letter-spacing:.05em;padding:5px 11px;border-radius:6px;font-size:16px;}
  .head h1{font-size:17px;margin:0;font-weight:800;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;}
  .scorebar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px;}
  .scorebar b{color:var(--ink);}

  /* 目もと帯 */
  .eyeband{width:100%;aspect-ratio:16/5;overflow:hidden;border-radius:12px;background:#000;border:1px solid var(--line);}
  .eyeband img{width:100%;height:100%;object-fit:cover;object-position:center 30%;}
  .full{width:100%;border-radius:12px;border:1px solid var(--line);display:block;background:#000;max-height:340px;object-fit:cover;object-position:center 22%;}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
  .opt{padding:14px 8px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;}
  .opt.correct{background:rgba(34,197,94,.25);border-color:var(--grn);}
  .opt.wrong{background:rgba(225,6,0,.25);border-color:var(--red);}
  .fb{text-align:center;margin-top:12px;font-weight:900;font-size:16px;}
  .btn{width:100%;padding:13px;border:none;border-radius:11px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;margin-top:12px;}
  .btn.red{background:var(--red);color:#fff;} .btn.gray{background:var(--card2);color:var(--ink);border:1px solid var(--line);}

  .result{text-align:center;padding:22px 10px;}
  .result .big{font-size:38px;font-weight:900;margin:8px 0;}
  .foot{color:var(--muted);font-size:11px;text-align:center;margin-top:8px;line-height:1.7;}
</style>

<div class="wrap">
  <div class="head"><span class="logo">F1</span><h1>ドライバー 目もと当てクイズ</h1></div>
  <div id="area"></div>
  <div class="foot">画像出典：Wikipedia / Wikimedia Commons（CC BY-SA）。目もとだけ切り出して表示、回答すると顔全体が出ます。</div>
</div>

<script>
  var DRIVERS = [
    { n:'フェルスタッペン', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/2024-08-25_Motorsport%2C_Formel_1%2C_Gro%C3%9Fer_Preis_der_Niederlande_2024_STP_3973_by_Stepro_%28medium_crop%29.jpg/500px-2024-08-25_Motorsport%2C_Formel_1%2C_Gro%C3%9Fer_Preis_der_Niederlande_2024_STP_3973_by_Stepro_%28medium_crop%29.jpg' },
    { n:'ハミルトン', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Prime_Minister_Keir_Starmer_meets_Sir_Lewis_Hamilton_%2854566928382%29_%28cropped%29.jpg/500px-Prime_Minister_Keir_Starmer_meets_Sir_Lewis_Hamilton_%2854566928382%29_%28cropped%29.jpg' },
    { n:'ルクレール', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/2024-08-25_Motorsport%2C_Formel_1%2C_Gro%C3%9Fer_Preis_der_Niederlande_2024_STP_3978_by_Stepro_%28cropped2%29.jpg/500px-2024-08-25_Motorsport%2C_Formel_1%2C_Gro%C3%9Fer_Preis_der_Niederlande_2024_STP_3978_by_Stepro_%28cropped2%29.jpg' },
    { n:'ノリス', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/2024-08-25_Motorsport%2C_Formel_1%2C_Gro%C3%9Fer_Preis_der_Niederlande_2024_STP_3968_by_Stepro_%28cropped2%29.jpg/500px-2024-08-25_Motorsport%2C_Formel_1%2C_Gro%C3%9Fer_Preis_der_Niederlande_2024_STP_3968_by_Stepro_%28cropped2%29.jpg' },
    { n:'サインツ', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/ce/Formula1Gabelhofen2022_%2804%29_%28cropped2%29.jpg/500px-Formula1Gabelhofen2022_%2804%29_%28cropped2%29.jpg' },
    { n:'ラッセル', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/7/7f/KingsLeonSilverstne040724_%2828_of_112%29_%2853838006028%29_%28cropped%29.jpg/500px-KingsLeonSilverstne040724_%2828_of_112%29_%2853838006028%29_%28cropped%29.jpg' },
    { n:'ピアストリ', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/2026_Chinese_GP_-_Oscar_Piastri_%28cropped%29_%28cropped%29.jpg/500px-2026_Chinese_GP_-_Oscar_Piastri_%28cropped%29_%28cropped%29.jpg' },
    { n:'アロンソ', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/Alonso-68_%2824710447098%29.jpg/500px-Alonso-68_%2824710447098%29.jpg' },
    { n:'ペレス', img:'https://upload.wikimedia.org/wikipedia/commons/5/55/2021_US_GP_driver_parade_%28cropped2%29.jpg' },
    { n:'ガスリー', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fd/2022_French_Grand_Prix_%2852279065728%29_%28midcrop%29.png/500px-2022_French_Grand_Prix_%2852279065728%29_%28midcrop%29.png' },
    { n:'オコン', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/Esteban_Ocon_2024_Suzuka_%28cropped%29.jpg/500px-Esteban_Ocon_2024_Suzuka_%28cropped%29.jpg' },
    { n:'角田', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Yuki_Tsunoda_at_the_Melbourne_Walk_during_the_2026_Australian_Grand_Prix_%28028A8096%29.jpg/500px-Yuki_Tsunoda_at_the_Melbourne_Walk_during_the_2026_Australian_Grand_Prix_%28028A8096%29.jpg' },
    { n:'ボッタス', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/20/Valtteri_Bottas_at_the_2026_Adelaide_Motorsport_Festival_%28028A7556%29.jpg/500px-Valtteri_Bottas_at_the_2026_Adelaide_Motorsport_Festival_%28028A7556%29.jpg' },
    { n:'ヒュルケンベルグ', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/de/2019_Formula_One_tests_Barcelona%2C_Hulkenberg_%2840287128313%29.jpg/500px-2019_Formula_One_tests_Barcelona%2C_Hulkenberg_%2840287128313%29.jpg' },
    { n:'ストロール', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/2019_Formula_One_tests_Barcelona%2C_Stroll_%2833376133178%29.jpg/500px-2019_Formula_One_tests_Barcelona%2C_Stroll_%2833376133178%29.jpg' }
  ];

  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a; }

  var order=[], idx=0, score=0, answered=false;
  function start(){ order=shuffle(DRIVERS.map(function(_,i){return i;})); idx=0; score=0; render(); }

  function render(){
    var area=document.getElementById('area');
    if(idx>=order.length){
      area.innerHTML='<div class="card result"><div style="color:var(--muted)">結果</div><div class="big">'+score+' / '+order.length+'</div><div style="color:var(--muted)">'+(score===order.length?'全問正解！さすが🏆':score>=order.length*0.7?'なかなかのF1通！':'また挑戦してみて！')+'</div><button class="btn red" onclick="start()">もう一度</button></div>';
      return;
    }
    var d=DRIVERS[order[idx]];
    var wrongs=shuffle(DRIVERS.filter(function(x){return x.n!==d.n;})).map(function(x){return x.n;}).slice(0,3);
    var opts=shuffle([d.n].concat(wrongs));
    var h='<div class="card"><div class="scorebar"><span>第 '+(idx+1)+' 問 / '+order.length+'</span><span>スコア <b>'+score+'</b></span></div>';
    h+='<div class="eyeband"><img src="'+d.img+'" alt=""></div>';
    h+='<div class="opts">';
    opts.forEach(function(o){ h+='<button class="opt" data-n="'+o+'" onclick="answer(this)">'+o+'</button>'; });
    h+='</div><div class="fb" id="fb"></div>';
    h+='<div id="reveal"></div>';
    h+='<button class="btn gray" id="nextBtn" style="display:none" onclick="next()">次へ →</button></div>';
    area.innerHTML=h; answered=false;
  }
  window.answer=function(btn){
    if(answered) return; answered=true;
    var d=DRIVERS[order[idx]]; var chosen=btn.getAttribute('data-n');
    document.querySelectorAll('.opt').forEach(function(b){
      var n=b.getAttribute('data-n');
      if(n===d.n) b.classList.add('correct'); else if(n===chosen) b.classList.add('wrong');
      b.style.pointerEvents='none';
    });
    var fb=document.getElementById('fb');
    if(chosen===d.n){ score++; fb.textContent='⭕ 正解！ '+d.n; fb.style.color='#22c55e'; }
    else { fb.textContent='❌ 正解は '+d.n; fb.style.color='#e10600'; }
    document.getElementById('reveal').innerHTML='<img class="full" src="'+d.img+'" alt="" style="margin-top:12px">';
    document.getElementById('nextBtn').style.display='';
  };
  window.next=function(){ idx++; render(); };
  window.start=start;
  start();
</script>
