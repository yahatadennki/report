<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>そろそろリスト - お客様の家電</title>
<style>
  :root{
    --navy:#1a3a5c; --navy-deep:#12283f; --blue:#2e75b6; --sun:#f0a500;
    --paper:#f4f7fa; --card:#fff; --ink:#1c2530; --ink-soft:#4a5a6a; --line:#d7e0e8;
    --hot:#e8654f;
  }
  @media (prefers-color-scheme:dark){
    :root{ --paper:#10161d; --card:#1a2028; --ink:#e8edf2; --ink-soft:#a9b6c2;
           --line:#2c3844; --navy:#3f6a94; --navy-deep:#1a3a5c; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
       -webkit-text-size-adjust:100%}

  /* PIN */
  #pinGate{position:fixed;inset:0;z-index:9999;background:var(--paper);
           display:flex;align-items:center;justify-content:center;padding:20px}
  #pinGate.hidden{display:none}
  #pinGate .pinbox{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:30px 28px;text-align:center;max-width:320px;width:100%;box-shadow:0 6px 24px rgba(0,0,0,.12)}
  #pinGate input{font-family:inherit;font-size:24px;letter-spacing:.35em;text-align:center;
    padding:10px 8px;width:170px;border:1px solid var(--line);border-radius:10px;
    background:var(--paper);color:var(--ink)}
  #pinGate .pin-err{color:#e8654f;font-size:12px;height:16px;margin:6px 0}
  #pinGate button{font-family:inherit;font-size:15px;font-weight:700;margin-top:6px;
    padding:10px 28px;border:none;border-radius:8px;background:var(--blue);color:#fff}

  header{background:var(--navy);color:#fff;padding:15px 14px 12px;position:sticky;top:0;z-index:50}
  header h1{margin:0;font-size:17px}
  header .sub{font-size:11.5px;opacity:.78;margin-top:3px}
  .counts{display:flex;gap:8px;margin-top:10px}
  .count{flex:1;background:rgba(255,255,255,.12);border-radius:8px;padding:6px 4px;text-align:center}
  .count b{display:block;font-size:19px;line-height:1.15}
  .count span{font-size:10.5px;opacity:.8}

  .filters{background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px 10px}
  .frow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .frow::-webkit-scrollbar{display:none}
  .flabel{font-size:10.5px;color:var(--ink-soft);letter-spacing:.08em;margin:6px 0 3px}
  .chip{flex:0 0 auto;font-size:13px;font-family:inherit;padding:5px 12px;border-radius:999px;
        border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);white-space:nowrap}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
  .chip.age.on{background:var(--hot);border-color:var(--hot)}
  #q{width:100%;font-family:inherit;font-size:15px;padding:8px 11px;margin-top:8px;
     border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink)}

  main{padding:12px 12px 90px;max-width:720px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:11px;
        padding:12px 13px;margin-bottom:9px}
  .r1{display:flex;align-items:center;gap:8px}
  .ku{font-size:18px;line-height:1;color:var(--sun);flex:0 0 auto}
  .nm{font-size:16px;font-weight:700;flex:1;min-width:0}
  .age{flex:0 0 auto;font-size:12px;font-weight:700;padding:3px 8px;border-radius:5px;
       border:1px solid var(--line);color:var(--ink-soft)}
  .age.hot{background:var(--hot);border-color:var(--hot);color:#fff}
  .kd{font-size:14px;margin:7px 0 0}
  .kd b{font-size:15px}
  .meta{font-size:12px;color:var(--ink-soft);margin-top:3px}
  .addr{font-size:13px;margin:6px 0 0}
  .addr a{color:var(--blue);text-decoration:none}
  .acts{display:flex;gap:7px;margin-top:10px}
  .acts a{font-family:inherit;font-size:13px;font-weight:700;padding:8px 0;border-radius:8px;
          border:1px solid var(--line);background:var(--paper);color:var(--ink);
          text-decoration:none;text-align:center;flex:1}
  .empty,.loading{text-align:center;color:var(--ink-soft);padding:50px 20px;font-size:14px;line-height:1.9}
  .refresh{position:fixed;right:16px;bottom:20px;z-index:60;width:52px;height:52px;border-radius:50%;
           border:none;background:var(--blue);color:#fff;font-size:21px;box-shadow:0 4px 14px rgba(0,0,0,.28)}
</style>
</head>
<body>

<div id="pinGate">
  <div class="pinbox">
    <div style="font-size:34px">🔧</div>
    <p style="font-weight:700;font-size:16px;margin:8px 0 2px">そろそろリスト</p>
    <p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 16px">4桁のPINを入力してください</p>
    <input id="pinInput" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
    <div class="pin-err" id="pinErr"></div>
    <button type="button" onclick="checkPin()">入る</button>
  </div>
</div>

<header>
  <h1>🔧 そろそろリスト</h1>
  <div class="sub">点検で撮った銘板から、買い替え時期のものを探せます</div>
  <div class="counts">
    <div class="count"><b id="cShow">–</b><span>表示中</span></div>
    <div class="count"><b id="cAll">–</b><span>登録台数</span></div>
    <div class="count"><b id="cCust">–</b><span>お客様</span></div>
  </div>
</header>

<div class="filters">
  <div class="flabel">経過年数</div>
  <div class="frow" id="fAge"></div>
  <div class="flabel">種別</div>
  <div class="frow" id="fKind"></div>
  <div class="flabel">区</div>
  <div class="frow" id="fKu"></div>
  <input id="q" type="search" placeholder="お客様名・型番・メーカーで検索" oninput="render()">
</div>

<main><div class="loading" id="list">読み込んでいます…</div></main>
<button class="refresh" onclick="load(true)">↻</button>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwDhQVpdoB_Dt92NXiCXHFHREWf8O1EVU8jY_YyHtPH8wg7pB4INrcf7bTnN0QN-TAL/exec';
const CACHE = 'kaden_v1';
let DATA = [], fAge = 0, fKind = '', fKu = '';

/* PIN */
const PIN='7860', PKEY='kaden_pin_ok';
function checkPin(){
  const v=(document.getElementById('pinInput').value||'').trim();
  if(v===PIN){ try{localStorage.setItem(PKEY,'1')}catch(e){} reveal(); }
  else document.getElementById('pinErr').textContent='PINが違います';
}
function reveal(){ document.getElementById('pinGate').classList.add('hidden'); load(); }
document.getElementById('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkPin()});
try{ if(localStorage.getItem(PKEY)==='1') reveal(); }catch(e){}

function load(force){
  if(!force){
    try{
      const c=JSON.parse(localStorage.getItem(CACHE)||'null');
      if(c && Date.now()-c.t < 30*60*1000){ DATA=c.d; render(); }
    }catch(e){}
  }
  if(!DATA.length) document.getElementById('list').innerHTML='<div class="loading">読み込んでいます…</div>';
  fetch(API+'?action=kaden&t='+Date.now()).then(r=>r.json()).then(d=>{
    DATA=d;
    try{ localStorage.setItem(CACHE,JSON.stringify({t:Date.now(),d:d})); }catch(e){}
    render();
  }).catch(()=>{
    if(!DATA.length) document.getElementById('list').innerHTML=
      '<div class="empty">読み込めませんでした。<br>電波の良いところで ↻ を押してください。</div>';
  });
}

const AGES = [0,5,8,10,15];
function setAge(v){ fAge=v; render(); }
function setKind(v){ fKind=(fKind===v?'':v); render(); }
function setKu(v){ fKu=(fKu===v?'':v); render(); }

function match(x){
  if(fAge && !(x.age >= fAge)) return false;
  if(fKind && x.kind !== fKind) return false;
  if(fKu && (x.ku||'－') !== fKu) return false;
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  if(q){
    const s=(x.name+' '+x.model+' '+x.maker+' '+x.kind+' '+x.place).toLowerCase();
    if(!s.includes(q)) return false;
  }
  return true;
}

function render(){
  const list=document.getElementById('list');

  /* 経過年数 */
  document.getElementById('fAge').innerHTML = AGES.map(a =>
    '<button class="chip age'+(fAge===a?' on':'')+'" onclick="setAge('+a+')">'+
    (a===0?'すべて':a+'年以上')+'</button>').join('');

  /* 種別（データにあるものだけ） */
  const kinds=[]; DATA.forEach(x=>{ if(x.kind && kinds.indexOf(x.kind)<0) kinds.push(x.kind); });
  document.getElementById('fKind').innerHTML = kinds.map(k =>
    '<button class="chip'+(fKind===k?' on':'')+'" onclick="setKind(\''+k+'\')">'+esc(k)+
    ' '+DATA.filter(x=>x.kind===k).length+'</button>').join('') || '<span class="flabel">まだありません</span>';

  /* 区 */
  const kus=[]; DATA.forEach(x=>{ const k=x.ku||'－'; if(kus.indexOf(k)<0) kus.push(k); });
  kus.sort();
  document.getElementById('fKu').innerHTML = kus.map(k =>
    '<button class="chip'+(fKu===k?' on':'')+'" onclick="setKu(\''+k+'\')">'+
    (k==='－'?'区なし':k)+' '+DATA.filter(x=>(x.ku||'－')===k).length+'</button>').join('');

  const rows = DATA.filter(match);
  document.getElementById('cShow').textContent = rows.length;
  document.getElementById('cAll').textContent  = DATA.length;
  document.getElementById('cCust').textContent = new Set(DATA.map(x=>x.name)).size;

  if(!DATA.length){
    list.className='';
    list.innerHTML='<div class="empty">まだ1台も登録されていません。<br><br>'+
      '業務日報で写真タグを<b>「銘板」</b>にして<br>型番シールを撮ると、ここに貯まります 📷</div>';
    return;
  }
  if(!rows.length){ list.className=''; list.innerHTML='<div class="empty">条件に合うものがありません。</div>'; return; }

  list.className='';
  list.innerHTML = rows.map(card).join('');
}

function card(x){
  const hot = x.age >= 10;
  const mapQ = encodeURIComponent(x.address || x.name);
  return '<div class="card">'+
    '<div class="r1">'+
      (x.ku?'<span class="ku">'+x.ku+'</span>':'')+
      '<span class="nm">'+esc(x.name)+' 様</span>'+
      (x.age!=null?'<span class="age'+(hot?' hot':'')+'">'+x.age+'年</span>':'') +
    '</div>'+
    '<p class="kd"><b>'+esc(x.kind||'種別不明')+'</b>　'+esc(x.maker)+' '+esc(x.model)+'</p>'+
    '<div class="meta">'+(x.year?x.year+'年製':'製造年不明')+
      (x.place?'　/　'+esc(x.place):'')+(x.staff?'　/　'+esc(x.staff):'')+'</div>'+
    (x.address?'<p class="addr"><a href="https://www.google.com/maps/search/?api=1&query='+mapQ+
      '" target="_blank" rel="noopener">'+esc(x.address)+'</a></p>':'')+
    '<div class="acts">'+
      (x.tel?'<a href="tel:'+esc(String(x.tel).replace(/[^0-9]/g,''))+'">☎ 電話</a>':'')+
      (x.address?'<a href="https://www.google.com/maps/search/?api=1&query='+mapQ+
        '" target="_blank" rel="noopener">🗺 地図</a>':'')+
    '</div>'+
  '</div>';
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
