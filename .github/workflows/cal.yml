name: 経済指標カレンダー
# 円メーター（mackline/）に出す「今週の経済指標」を 6時間ごとに作り直す
on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:
  push:
    paths: ['tools/cal.mjs', '.github/workflows/cal.yml']
permissions:
  contents: write
concurrency:
  group: cal
jobs:
  cal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node tools/cal.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mackline/cal.json
          git diff --cached --quiet || (git commit -m "経済指標カレンダーを更新" && git pull --rebase && git push)
