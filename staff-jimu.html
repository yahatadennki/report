<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>事務スタッフ｜ヤハタ電機商会</title>
<style>
  :root{--navy:#1a3a5c;--navy-deep:#12283f;--paper:#f4f7fa;--card:#fff;--ink:#1c2530;--ink-soft:#4a5a6a;--line:#d7e0e8;}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#10161d;--card:#1a2028;--ink:#e8edf2;--ink-soft:#a9b6c2;--line:#2c3844;--navy:#3f6a94;--navy-deep:#1a3a5c;}}
  :root[data-theme="dark"]{--paper:#10161d;--card:#1a2028;--ink:#e8edf2;--ink-soft:#a9b6c2;--line:#2c3844;--navy:#3f6a94;--navy-deep:#1a3a5c;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Yu Gothic Medium","Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;line-height:1.7;padding:28px 16px 70px;}
  .wrap{max-width:860px;margin:0 auto;}
  .back{display:inline-block;font-size:13px;padding:8px 16px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;margin-bottom:16px;}
  .head{background:linear-gradient(135deg,var(--navy),var(--navy-deep));color:#fff;border-radius:10px;padding:24px 28px;}
  .head p{font-size:12px;letter-spacing:.14em;color:#cfe0ee;margin:0 0 6px;}
  .head h1{font-size:23px;margin:0;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="manual.html">&larr; ポータルへ戻る</a>
  <div class="head"><p>ヤハタ電機商会　現場サポート</p><h1>📎 事務スタッフ</h1></div>
</div>
</body>
</html>
