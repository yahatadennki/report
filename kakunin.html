<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>入荷・工事の確認 - ヤハタ電機商会</title>
<style>
  :root{
    --paper:#f4f7fa; --card:#fff; --ink:#1c2530; --soft:#4a5a6a; --line:#d7e0e8;
    --navy:#1a3a5c; --navy2:#12283f; --blue:#2e75b6; --ok:#2e7d32; --hot:#c5221f;
    --pink:#a3195b;
  }
  @media (prefers-color-scheme:dark){
    :root{--paper:#10161d;--card:#1a2028;--ink:#e8edf2;--soft:#a9b6c2;--line:#2c3844;--navy:#3f6a94;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);line-height:1.7;
    font-family:"Yu Gothic Medium","Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
    padding:0 0 70px;-webkit-text-size-adjust:100%}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px}

  .head{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);
    color:#fff;border-radius:0 0 14px 14px;padding:20px 18px 18px;margin-bottom:16px}
  .head .e{font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.72);margin:0 0 4px}
  .head h1{font-size:20px;font-weight:700;margin:0 0 4px}
  .head p{font-size:12.5px;color:rgba(255,255,255,.82);margin:0}

  h2{font-size:15px;margin:24px 0 10px;padding-left:9px;border-left:3px solid #f0a500}
  h2 .n{font-size:13px;color:var(--soft);font-weight:400;margin-left:6px}

  .item{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:13px 15px;margin-bottom:9px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .item .t{font-size:15.5px;font-weight:700}
  .item .t .cust{color:var(--pink)}
  .item .m{font-size:12.5px;color:var(--soft);margin-top:2px}
  .item .m b{color:var(--hot)}
  .acts{display:flex;gap:8px;margin-top:10px}
  .acts button{flex:1;font-family:inherit;font-size:14px;font-weight:700;padding:10px 0;
    border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
  .acts button.go{background:var(--ok);border-color:var(--ok);color:#fff}
  .acts button:disabled{opacity:.5}

  .empty{text-align:center;color:var(--soft);padding:26px 16px;font-size:13.5px;
    background:var(--card);border:1px solid var(--line);border-radius:10px}
  .loading{text-align:center;color:var(--soft);padding:40px 16px}

  .memo{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;margin-top:22px;font-size:12.5px;color:var(--soft)}
  .memo b{color:var(--ink)}
  .memo a{display:block;margin-top:10px;text-align:center;font-weight:700;font-size:13.5px;
    padding:10px 0;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink)}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy2);
    color:#fff;padding:10px 20px;border-radius:999px;font-size:13.5px;opacity:0;transition:opacity .2s;
    pointer-events:none;z-index:200}
  .toast.on{opacity:.96}

  #pinGate{position:fixed;inset:0;z-index:9999;background:var(--paper);
    display:flex;align-items:center;justify-content:center;padding:20px}
  #pinGate.hidden{display:none}
  #pinGate .box{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:30px 28px;text-align:center;max-width:320px;width:100%}
  #pinGate input{font-family:inherit;font-size:24px;letter-spacing:.35em;text-align:center;
    padding:10px 8px;width:170px;border:1px solid var(--line);border-radius:10px;
    background:var(--paper);color:var(--ink)}
  #pinGate .err{color:var(--hot);font-size:12px;height:16px;margin:6px 0}
  #pinGate button{font-family:inherit;font-size:15px;font-weight:700;margin-top:6px;
    padding:10px 28px;border:none;border-radius:8px;background:var(--blue);color:#fff}
</style>
</head>
<body>

<div id="pinGate"><div class="box">
  <div style="font-size:34px">✅</div>
  <p style="font-weight:700;font-size:16px;margin:8px 0 2px">入荷・工事の確認</p>
  <p style="font-size:12.5px;color:var(--soft);margin:0 0 16px">4桁のPINを入力してください</p>
  <input id="pinInput" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
  <div class="err" id="pinErr"></div>
  <button type="button" onclick="checkPin()">入る</button>
</div></div>

<div class="head">
  <p class="e">朝いちで開く</p>
  <h1>入荷・工事の確認</h1>
  <p>押すだけで在庫表が直ります。</p>
</div>

<div class="wrap">
  <div id="body"><div class="loading">読み込んでいます…</div></div>

  <div class="memo">
    <b>ずれていたら、在庫表を直接なおしてOKです。</b><br>
    マスはクリックで選べます。自動で入った分も上書きできます。<br>
    🟢在庫 ／ 🌸売約済み ／ 🟣工事予定 ／ 🔵貸 ／ 🔴借 ／ 🔷入荷予定
    <a href="https://docs.google.com/spreadsheets/d/1Pqb_DY3utvxKhTCIb4PJ0yNGra3hi1aSyFOHrydmuY0/edit#gid=47295936" target="_blank" rel="noopener">📦 在庫表をひらく</a>
    <a href="hacchu.html">📷 発注を取り込む</a>
    <a href="menu.html">🛠 業務ポータルへ</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API='https://script.google.com/macros/s/AKfycbwvdA3LTxWHAEk2PLPKcOdWjS8hJMSLJYApa3O2EU9vvBsgdsRn8SA3Q-EZSgGccvM/exec';

const PIN='7860',PKEY='kakunin_pin_ok';
function checkPin(){
  const v=(document.getElementById('pinInput').value||'').trim();
  if(v===PIN){try{localStorage.setItem(PKEY,'1')}catch(e){}reveal();}
  else document.getElementById('pinErr').textContent='PINが違います';
}
function reveal(){document.getElementById('pinGate').classList.add('hidden');load();}
document.getElementById('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkPin()});
try{if(localStorage.getItem(PKEY)==='1')reveal()}catch(e){}

function post(body){
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(body)}).then(r=>r.json());
}

function load(){
  document.getElementById('body').innerHTML='<div class="loading">読み込んでいます…</div>';
  post({action:'kakuninList'}).then(render)
    .catch(()=>{document.getElementById('body').innerHTML=
      '<div class="empty">読み込めませんでした。電波の良いところで開き直してください。</div>';});
}

function render(d){
  const nk=d.nyuka||[], kj=d.kouji||[];
  let h='';

  h+='<h2>📦 入荷しましたか？<span class="n">'+nk.length+'件</span></h2>';
  h+= nk.length ? nk.map((x,i)=>
      '<div class="item" id="nk'+i+'">'+
        '<div class="t">'+esc(x.model)+' '+x.qty+'台'+
          (x.isCust?' <span class="cust">🌸 '+esc(x.memo)+'</span>':' <span style="color:var(--soft)">（'+esc(x.memo||'在庫用')+'）</span>')+
        '</div>'+
        '<div class="m">納期 '+esc(x.noki)+(x.days>0?' ／ <b>'+x.days+'日経過</b>':' ／ 本日')+'</div>'+
        '<div class="acts">'+
          '<button class="go" onclick="nyuka('+x.row+',this)">入荷した</button>'+
          '<button onclick="hide(\'nk'+i+'\')">まだ</button>'+
        '</div>'+
      '</div>').join('')
    : '<div class="empty">確認するものはありません</div>';

  h+='<h2>🔧 工事終わりましたか？<span class="n">'+kj.length+'件</span></h2>';
  h+= kj.length ? kj.map((x,i)=>
      '<div class="item" id="kj'+i+'">'+
        '<div class="t">'+esc(x.cust)+'</div>'+
        '<div class="m">'+esc(x.model)+' '+x.qty+'台 ／ 工事日 '+esc(x.sched)+
          (x.days>0?' ／ <b>'+x.days+'日経過</b>':' ／ 本日')+'</div>'+
        '<div class="acts">'+
          '<button class="go" onclick="kouji(\''+esc(x.mark)+'\',this)">終わった</button>'+
          '<button onclick="hide(\'kj'+i+'\')">まだ</button>'+
        '</div>'+
      '</div>').join('')
    : '<div class="empty">確認するものはありません</div>';

  document.getElementById('body').innerHTML=h;
}

function nyuka(row,btn){
  btn.disabled=true;btn.textContent='…';
  post({action:'nyukaDone',row:row}).then(()=>{toast('在庫に入れました');load();})
    .catch(()=>{btn.disabled=false;btn.textContent='入荷した';toast('できませんでした');});
}
function kouji(mark,btn){
  btn.disabled=true;btn.textContent='…';
  post({action:'koujiDone',mark:mark}).then(()=>{toast('在庫から外しました');load();})
    .catch(()=>{btn.disabled=false;btn.textContent='終わった';toast('できませんでした');});
}
function hide(id){const el=document.getElementById(id);if(el)el.style.display='none';}

let tt;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2000);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
