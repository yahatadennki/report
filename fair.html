<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フェア来店記録 - ヤハタ電機商会</title>
<style>
  :root { --sun:#f59e0b; --sun-d:#d97706; --navy:#1a3a5c; --ink:#1f2937; --soft:#6b7280; --line:#e5e7eb; --bg:#fff8eb; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:"Yu Gothic Medium","Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP","Meiryo",sans-serif; }
  button { font-family:inherit; cursor:pointer; }
  .wrap { max-width:680px; margin:0 auto; padding:16px 14px 80px; }
  .head { background:linear-gradient(135deg,#f59e0b,#ea580c); color:#fff; border-radius:14px; padding:16px 18px; }
  .head h1 { margin:0; font-size:20px; }
  .head .d { font-size:13px; opacity:.9; }
  .areas { display:grid; grid-template-columns:repeat(10,1fr); gap:4px; margin-top:12px; }
  .areas div { background:rgba(255,255,255,.2); border-radius:8px; text-align:center; padding:4px 0; }
  .areas b { display:block; font-size:18px; line-height:1.2; }
  .areas span { font-size:10px; }
  .areas .tot { background:#fff; color:#c2410c; }
  .box { background:#fff; border-radius:14px; padding:16px; margin-top:14px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .box.edit { outline:3px solid #3b82f6; }
  .lbl { font-size:13px; font-weight:700; color:var(--navy); margin:14px 0 8px; }
  .lbl:first-child { margin-top:0; }
  .grid { display:grid; gap:6px; }
  .g4 { grid-template-columns:repeat(4,1fr); } .g5 { grid-template-columns:repeat(5,1fr); } .g3 { grid-template-columns:repeat(3,1fr); }
  .opt { padding:10px 0; border:2px solid var(--line); background:#fff; border-radius:8px; font-size:15px; font-weight:700; color:var(--ink); }
  .opt.on { background:var(--sun); border-color:var(--sun-d); color:#fff; }
  .chk { padding:11px 4px; border:2px solid var(--line); background:#fff; border-radius:8px; font-size:14px; font-weight:700; color:var(--ink); }
  .chk.on { background:#16a34a; border-color:#15803d; color:#fff; }
  .chk.on::before { content:'✓ '; }
  input, textarea { width:100%; padding:12px; font-size:17px; border:2px solid var(--line); border-radius:10px; outline:none; font-family:inherit; }
  input:focus, textarea:focus { border-color:var(--sun); }
  .cands { margin-top:6px; border-radius:10px; overflow:hidden; }
  .cand { padding:11px 12px; border-bottom:1px solid var(--line); background:#fafafa; cursor:pointer; }
  .cand:active { background:#fef3c7; }
  .cand .n { font-weight:700; }
  .cand .s { font-size:12px; color:var(--soft); }
  .scan { margin-top:8px; width:100%; padding:12px; border:none; border-radius:10px; background:#0f766e; color:#fff; font-size:16px; font-weight:700; }
  .code { font-size:11px; color:#0f766e; font-weight:700; }
  .pana { display:inline-block; background:#1d4ed8; color:#fff; font-weight:700; font-size:12px; padding:2px 10px; border-radius:999px; margin-left:6px; vertical-align:middle; }
  .pana.big { display:block; margin:0 0 10px; padding:10px; font-size:18px; text-align:center; border-radius:10px; }
  .pana.end { background:#9ca3af; }
  .item.pa { background:#eff6ff; border-left:5px solid #1d4ed8; padding-left:8px; border-radius:6px; }
  .msg { font-size:13px; color:var(--soft); padding:8px 2px; }
  .newbtn { margin-top:8px; width:100%; padding:10px; border:2px dashed #fbbf24; background:#fffbeb; border-radius:10px; font-size:14px; font-weight:700; color:#92400e; }
  .picked { border:2px solid var(--sun); border-radius:12px; padding:12px; background:#fffbeb; }
  .picked .row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .picked .row span { width:44px; font-size:12px; color:var(--soft); flex:none; }
  .picked .row input { padding:8px 10px; font-size:16px; }
  .tag { display:inline-block; font-size:11px; padding:2px 9px; border-radius:999px; background:#dcfce7; color:#166534; font-weight:700; }
  .tag.new { background:#fee2e2; color:#991b1b; }
  .warn { margin-top:8px; font-size:13px; color:#b45309; font-weight:700; }
  .clear { float:right; font-size:13px; background:none; border:none; color:var(--soft); text-decoration:underline; }
  .go { margin-top:16px; width:100%; padding:16px; font-size:19px; font-weight:700; color:#fff; background:var(--navy); border:none; border-radius:12px; }
  .go.blue { background:#2563eb; }
  .sub { margin-top:8px; width:100%; padding:10px; font-size:14px; background:#fff; border:1px solid var(--line); border-radius:10px; color:var(--soft); }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#166534; color:#fff; padding:12px 22px; border-radius:999px; font-weight:700; display:none; z-index:50; white-space:nowrap; }
  .item { display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:last-child { border-bottom:none; }
  .item .no { font-size:15px; font-weight:700; color:#c2410c; width:28px; flex:none; text-align:right; }
  .item .b { flex:1; }
  .item .n { font-weight:700; }
  .item .s { font-size:12px; color:var(--soft); }
  .mk { display:inline-block; font-size:11px; padding:0 6px; border-radius:4px; background:#e0f2fe; color:#075985; margin-right:3px; }
  .mk.g { background:#fef3c7; color:#92400e; }
  .pend { font-size:11px; color:#b45309; }
  #pin { position:fixed; inset:0; background:linear-gradient(135deg,#f59e0b,#ea580c); display:flex; align-items:center; justify-content:center; z-index:99; }
  #pin > div { background:#fff; border-radius:20px; padding:36px 28px; width:90%; max-width:340px; text-align:center; }
  #pin input { font-size:28px; letter-spacing:12px; text-align:center; margin:14px 0; }
</style>
</head>
<body>

<div id="pin"><div>
  <div style="font-size:44px">🎪</div>
  <div style="font-weight:700;color:var(--navy);font-size:18px">フェア来店記録</div>
  <div style="font-size:13px;color:var(--soft)">PINコードを入力してください</div>
  <input id="pinIn" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="●●●●" onkeydown="if(event.key==='Enter')verifyPin()">
  <div id="pinErr" style="color:#dc2626;font-size:13px;min-height:18px"></div>
  <button class="go" onclick="verifyPin()" style="background:var(--sun-d)">ひらく</button>
</div></div>

<div class="wrap" id="app" style="display:none">
  <div class="head">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <div><h1>🎪 フェア来店記録</h1><div class="d" id="today"></div></div>
      <a id="sheetLink" href="https://docs.google.com/spreadsheets/d/1Cg5FACS_HqpAlchsU6O4ansNHc7GO_FOWAYhpX_72_w/edit" target="_blank"
         style="flex:none;background:#fff;color:#c2410c;font-weight:700;font-size:13px;text-decoration:none;padding:8px 12px;border-radius:999px">📊 シートを開く</a>
    </div>
    <div class="areas" id="areas"></div>
  </div>

  <div class="box" id="formBox">
    <p class="lbl">受付した人</p>
    <div class="grid g4" id="staff"></div>

    <p class="lbl">お客様 <button class="clear" id="clearBtn" onclick="clearForm()" style="display:none">やり直す</button></p>
    <div id="searchArea">
      <input id="q" placeholder="お名前・ふりがな・電話・顧客コード" oninput="onSearch()" onkeydown="if(event.key==='Enter'){event.preventDefault();codeEnter();}" autocomplete="off">
      <button class="scan" id="scanBtn" onclick="toggleScan()">📷 カードのバーコードを読む</button>
      <div id="scanMsg"></div>
      <video id="cam" playsinline muted autoplay style="display:none;width:100%;margin-top:8px;border-radius:10px;background:#000"></video>
      <div class="cands" id="cands"></div>
    </div>
    <div id="pickedArea"></div>

    <div id="detail" style="display:none">
      <p class="lbl">区域</p>
      <div class="grid g5" id="areaBtns"></div>

      <p class="lbl">チェック</p>
      <div class="grid g3" id="chks"></div>

      <p class="lbl">ガラポン</p>
      <div class="grid g5" id="gara"></div>

      <p class="lbl">予定日</p>
      <input id="plan" placeholder="例）12/5 工事" oninput="form.plan=this.value">

      <p class="lbl">内容</p>
      <textarea id="memo" rows="2" placeholder="例）エアコン買換え・記入済後日・口座未 など" oninput="form.memo=this.value"></textarea>

      <button class="go" id="goBtn" onclick="submitVisit()">来店を記録する</button>
      <button class="sub" id="delBtn" onclick="delVisit()" style="display:none">この記録を取り消す</button>
    </div>
  </div>

  <div class="box">
    <p class="lbl">本日の来店一覧（タップで変更）</p>
    <div id="list"><div class="msg">読み込み中…</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const GAS = 'https://script.google.com/macros/s/AKfycbybHVTvastbYdcePLc-WxDZtChBKtpcEPF7IYqMX4UPVs1TbfKnIhvnhlIJGtIfK8Y/exec';
const PIN_HASH = 'e2f691407acb1efa4c9f9f8b1ae626cf6d9a4d96e73e207e9ea7f429293127a8';
const AUTH_KEY = 'fair_auth_v1';
const STAFF = ['高山','伊藤','服部','石橋','角井','北沢','宇留野'];
const AREAS = ['1区','2区','3区','4区','5区','6区','7区','8区','9区'];
const CHKS = [['md','MD'],['panaJoin','ﾊﾟﾅｶｰﾄﾞ入会'],['panaForm','ﾊﾟﾅｶｰﾄﾞ用紙記入'],['credit','クレジット'],['cash','現金']];
const GARA = ['特賞','1等','金','銀',''];
const CUST_CACHE_KEY = 'fair_customers_v1';   // 顧客コード入りで保存（受注日報の保存分はコードが無いので別に持つ）
const PEND_KEY = 'fair_pending_v1';

const ymd = d => { const z = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); };
const hm  = d => String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TODAY = ymd(new Date());

/* ---------- PIN ---------- */
async function sha(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
async function verifyPin(){
  const v = document.getElementById('pinIn').value;
  if (await sha(v) === PIN_HASH) { localStorage.setItem(AUTH_KEY, Date.now()+30*86400000); start(); }
  else { document.getElementById('pinErr').textContent = '❌ PINが違います'; document.getElementById('pinIn').value=''; }
}

/* ---------- 状態 ---------- */
let staff = localStorage.getItem('fair_staff') || '';
let customers = [], custState = 'loading', results = [], visits = [];
let form = null;   // 入力中の1件（null＝未選択）

function blank(){ return { id:'', code:'', card:'', name:'', address:'', tel:'', area:'', inMaster:false, md:false, panaJoin:false, panaForm:false, credit:false, cash:false, garapon:'', plan:'', memo:'' }; }

function start(){
  document.getElementById('pin').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const d = new Date();
  document.getElementById('today').textContent = d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+'日月火水木金土'[d.getDay()]+'）';
  renderStaff(); renderForm(); renderAreas(); loadCustomers(); loadList(); resendPending();
  fetch(GAS+'?action=fairSheetUrl').then(r=>r.json()).then(j=>{ if (j.url) document.getElementById('sheetLink').href = j.url; }).catch(()=>{});
  setInterval(()=>{ if (pending().length) resendPending(); }, 30000);
  setInterval(()=>{ if (!form || !form.id) loadList(); }, 60000);   // 他の端末の分も反映
}

function renderStaff(){
  document.getElementById('staff').innerHTML = STAFF.map(s =>
    '<button class="opt '+(s===staff?'on':'')+'" onclick="setStaff(\''+s+'\')">'+s+'</button>').join('');
}
function setStaff(s){ staff = s; localStorage.setItem('fair_staff', s); renderStaff(); }

/* ---------- 区域別人数（Excel右側の表） ---------- */
function renderAreas(){
  const c = {}; visits.forEach(v => { c[v.area] = (c[v.area]||0)+1; });
  document.getElementById('areas').innerHTML = AREAS.map(a => '<div><b>'+(c[a]||0)+'</b><span>'+a+'</span></div>').join('') +
    '<div class="tot"><b>'+visits.length+'</b><span>合計</span></div>';
}

/* ---------- 顧客マスタ（受注日報と同じ読み込み） ---------- */
async function loadCustomers(){
  try {
    const c = JSON.parse(localStorage.getItem(CUST_CACHE_KEY)||'null');
    if (c && c.date === new Date().toISOString().slice(0,10) && Array.isArray(c.data) && c.data.length) { customers = c.data; custState = 'ready'; }
  } catch(e){}
  for (let i=0;i<3;i++){
    try {
      const list = await (await fetch(GAS+'?action=customers')).json();
      if (Array.isArray(list) && list.length){
        customers = list; custState = 'ready';
        try { localStorage.setItem(CUST_CACHE_KEY, JSON.stringify({date:new Date().toISOString().slice(0,10), data:list})); } catch(e){}
        onSearch(); return;
      }
    } catch(e){}
    await new Promise(r=>setTimeout(r,1500));
  }
  if (!customers.length){ custState = 'error'; onSearch(); }
}

function toKana(str){
  return String(str)
    .replace(/ｶﾞ/g,'ガ').replace(/ｷﾞ/g,'ギ').replace(/ｸﾞ/g,'グ').replace(/ｹﾞ/g,'ゲ').replace(/ｺﾞ/g,'ゴ')
    .replace(/ｻﾞ/g,'ザ').replace(/ｼﾞ/g,'ジ').replace(/ｽﾞ/g,'ズ').replace(/ｾﾞ/g,'ゼ').replace(/ｿﾞ/g,'ゾ')
    .replace(/ﾀﾞ/g,'ダ').replace(/ﾁﾞ/g,'ヂ').replace(/ﾂﾞ/g,'ヅ').replace(/ﾃﾞ/g,'デ').replace(/ﾄﾞ/g,'ド')
    .replace(/ﾊﾞ/g,'バ').replace(/ﾋﾞ/g,'ビ').replace(/ﾌﾞ/g,'ブ').replace(/ﾍﾞ/g,'ベ').replace(/ﾎﾞ/g,'ボ')
    .replace(/ﾊﾟ/g,'パ').replace(/ﾋﾟ/g,'ピ').replace(/ﾌﾟ/g,'プ').replace(/ﾍﾟ/g,'ペ').replace(/ﾎﾟ/g,'ポ')
    .replace(/ｳﾞ/g,'ヴ')
    .replace(/[ｦ-ﾝ]/g, c => { const hw='ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ', fw='ヲァィゥェォャュョッーアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン'; const i=hw.indexOf(c); return i>=0?fw[i]:c; })
    .replace(/[ぁ-ん]/g, c => String.fromCharCode(c.charCodeAt(0)+0x60));
}
const norm = s => toKana(s).replace(/[-\s　]/g,'').toLowerCase();
// パナカード：顧客マスタのカード区分（終了は除く）か、フェアで入会した人
const cardHolder = card => /ﾊﾟﾅ|パナ/.test(card||'') && !/終了/.test(card||'');
const isPana = v => cardHolder(v.card) || !!v.panaJoin;
const panaBadge = (card, big) => cardHolder(card)
  ? '<span class="pana'+(big?' big':'')+'">💳 '+(big?'パナカード会員（'+esc(card)+'）':'パナカード')+'</span>'
  : (/終了/.test(card||'') ? '<span class="pana end'+(big?' big':'')+'">パナカード終了</span>' : '');
const areaOf = c => { const m = String((c&&c.ku)||'').match(/(\d+)\s*区/); return m ? m[1]+'区' : ''; };
const telOf = c => (c.telList && c.telList.length) ? c.telList.join(' / ') : (c.tel||'');

const codeKey = s => String(s||'').replace(/\D/g,'').replace(/^0+/,'');
function findByCode(raw){
  const k = codeKey(raw); if (!k) return null;
  return customers.find(c => codeKey(c.no) === k) || null;
}
// バーコードリーダー（キーボードとして打ち込み＋Enter）や手入力の顧客コード
function codeEnter(){
  const raw = document.getElementById('q').value.trim();
  if (!/^[0-9\s-]+$/.test(raw)) return;
  const c = findByCode(raw);
  if (c){ pickCust(c); toast('📇 '+c.name+' 様'); }
  else toast('顧客コード '+raw+' は見つかりません');
}
function pickCust(c){
  stopScan();
  form = Object.assign(blank(), { code:c.no||'', card:c.card||'', name:c.name, address:c.address||'', tel:telOf(c), area:areaOf(c), inMaster:true });
  renderForm();
}

/* ---------- カメラでバーコード ---------- */
// カメラは自分で起動する（止まった理由を画面に出す）。読み取りは端末の機能(BarcodeDetector)→無ければZXing(同梱)
let scanning = false, scanStream = null, scanTimer = null, zxLib = null;
function scanMsg(t, err){
  const el = document.getElementById('scanMsg');
  el.innerHTML = t ? '<div style="font-size:13px;padding:8px 4px;color:'+(err?'#dc2626':'#0f766e')+'">'+t+'</div>' : '';
}
function loadZX(){
  if (window.ZXing) return Promise.resolve();
  if (zxLib) return zxLib;
  zxLib = new Promise((ok, ng) => { const t = document.createElement('script');
    t.src = 'zxing.min.js?v=1'; t.onload = ok; t.onerror = () => { zxLib = null; ng(new Error('読み取り部品を読み込めません')); }; document.head.appendChild(t); });
  return zxLib;
}
const timeout = (p, ms, msg) => Promise.race([p, new Promise((_, ng) => setTimeout(() => ng(new Error(msg)), ms))]);

async function toggleScan(){
  if (scanning){ stopScan(); return; }
  const btn = document.getElementById('scanBtn');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    scanMsg('⚠ このブラウザではカメラを使えません。LINEなどの中で開いている場合は、右上のメニューから「Safari／Chromeで開く」にしてください。', true);
    return;
  }
  scanning = true;
  btn.textContent = '✕ カメラを閉じる';
  scanMsg('⏳ カメラを起動しています…（「カメラを許可」と出たら「許可」を押してください）');
  try {
    scanStream = await timeout(navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false }),
      20000, 'カメラの許可が出ていません');
    if (!scanning){ scanStream.getTracks().forEach(t=>t.stop()); return; }
    const v = document.getElementById('cam');
    v.srcObject = scanStream;
    v.style.display = 'block';
    await v.play().catch(()=>{});
    scanMsg('📷 カードのバーコードを枠いっぱいに映してください');

    let detect;
    if ('BarcodeDetector' in window){
      const fm = await BarcodeDetector.getSupportedFormats().catch(()=>[]);
      const bd = new BarcodeDetector(fm.length ? { formats: fm } : undefined);
      detect = async () => { const r = await bd.detect(v); return r[0] && r[0].rawValue; };
    } else {
      await timeout(loadZX(), 20000, '読み取り部品を読み込めません');
      const Z = window.ZXing;
      const hints = new Map(); hints.set(Z.DecodeHintType.TRY_HARDER, true);
      const reader = new Z.MultiFormatReader(); reader.setHints(hints);
      const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently:true });
      detect = async () => {
        if (!v.videoWidth) return null;
        const w = Math.min(960, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth);
        cv.width = w; cv.height = h; cx.drawImage(v, 0, 0, w, h);
        try { return reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)))).getText(); }
        catch(e){ return null; }
      };
    }
    let busy = false, lastBad = '';
    scanTimer = setInterval(async () => {
      if (busy || !scanning) return; busy = true;
      try {
        const text = await detect();
        if (text && scanning){
          const c = customers.length ? findByCode(text) : null;
          if (c){ if (navigator.vibrate) navigator.vibrate(80); pickCust(c); toast('📇 '+c.name+' 様'); }
          else if (!customers.length) scanMsg('⏳ 顧客データを読み込み中です。少し待ってもう一度映してください');
          else if (text !== lastBad){ lastBad = text; scanMsg('⚠ 「'+esc(text)+'」は顧客マスタにありません', true); }
        }
      } catch(e){}
      busy = false;
    }, 250);
  } catch(e){
    const name = e && e.name;
    const why = name === 'NotAllowedError' ? 'カメラが許可されていません。ブラウザの設定でこのページのカメラを「許可」にしてください。'
      : name === 'NotFoundError' ? 'カメラが見つかりません。'
      : name === 'NotReadableError' ? '他のアプリがカメラを使っています。閉じてからもう一度押してください。'
      : (e && e.message) || 'カメラを使えませんでした';
    stopScan();
    scanMsg('⚠ ' + esc(why), true);
  }
}
function stopScan(){
  scanning = false;
  clearInterval(scanTimer); scanTimer = null;
  if (scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; }
  const v = document.getElementById('cam'); if (v){ v.srcObject = null; v.style.display = 'none'; }
  const btn = document.getElementById('scanBtn'); if (btn) btn.textContent = '📷 カードのバーコードを読む';
  scanMsg('');
}

function onSearch(){
  const raw = document.getElementById('q').value.trim();
  const box = document.getElementById('cands');
  if (!raw){ box.innerHTML=''; return; }
  if (!customers.length){
    box.innerHTML = custState==='error'
      ? '<div class="msg" style="color:#dc2626">⚠️ 顧客データを読み込めませんでした <button onclick="location.reload()">再読み込み</button></div>' + newBtn(raw)
      : '<div class="msg">⏳ 顧客データを読み込み中です…</div>';
    return;
  }
  const q = norm(raw), qt = raw.replace(/[-\s]/g,'');
  const byCode = /^\d+$/.test(qt) ? customers.filter(c => codeKey(c.no) === codeKey(qt)) : [];
  results = byCode.concat(customers.filter(c => !byCode.includes(c) && (norm(c.name).includes(q) || norm(c.kana).includes(q) ||
    (/^\d{3,}$/.test(qt) && c.tels && c.tels.includes(qt)) || (c.address && c.address.includes(raw))))).slice(0,15);
  box.innerHTML = (results.length ? results.map((c,i) =>
    '<div class="cand" onclick="pick('+i+')"><div class="code">No.'+esc(c.no)+'</div><div class="n">'+esc(areaOf(c))+'　'+esc(c.name)+' 様'+panaBadge(c.card)+'</div><div class="s">'+esc(telOf(c))+'　'+esc(c.address)+'</div></div>').join('')
    : '<div class="msg">顧客マスタに見つかりません</div>') + newBtn(raw);
}
function newBtn(raw){ return '<button class="newbtn" onclick="pickNew()">＋「'+esc(raw)+'」さんを新規のお客様として入力</button>'; }

function pick(i){
  const c = results[i]; if (c) pickCust(c);
}
function pickNew(){
  stopScan();
  form = Object.assign(blank(), { name:document.getElementById('q').value.trim() });
  renderForm();
}
function clearForm(){
  form = null; document.getElementById('q').value=''; document.getElementById('cands').innerHTML='';
  renderForm(); window.scrollTo({top:0, behavior:'smooth'});
}

function renderForm(){
  const on = !!form, editing = on && !!form.id;
  document.getElementById('searchArea').style.display = on ? 'none' : 'block';
  document.getElementById('clearBtn').style.display = on ? 'inline' : 'none';
  document.getElementById('detail').style.display = on ? 'block' : 'none';
  document.getElementById('formBox').classList.toggle('edit', editing);
  const a = document.getElementById('pickedArea');
  if (!on){ a.innerHTML=''; return; }
  const dup = !editing && visits.some(v => norm(v.name) === norm(form.name));
  a.innerHTML = '<div class="picked">' + panaBadge(form.card, true) +
    (!cardHolder(form.card) && form.panaJoin ? '<span class="pana big">💳 パナカード（フェアで入会）</span>' : '') +
    '<div style="margin-bottom:8px">'+(editing ? '<span class="tag" style="background:#dbeafe;color:#1e40af">№'+esc(form.no||'')+' を変更中</span> ' : '') +
    (form.inMaster ? '<span class="tag">顧客マスタから'+(form.code?'　No.'+esc(form.code):'')+'</span>' : '<span class="tag new">新規のお客様</span>')+'</div>' +
    row('お名前','name') + row('住所','address') + row('電話','tel','tel') +
    (dup ? '<div class="warn">⚠ 本日すでに来店記録があります</div>' : '') + '</div>';
  document.getElementById('areaBtns').innerHTML = AREAS.concat(['不明']).map(x => {
    const v = x==='不明' ? '' : x;
    return '<button class="opt '+(form.area===v?'on':'')+'" onclick="form.area=\''+v+'\';renderForm()">'+x+'</button>';
  }).join('');
  document.getElementById('chks').innerHTML = CHKS.map(([k,l]) =>
    '<button class="chk '+(form[k]?'on':'')+'" onclick="form.'+k+'=!form.'+k+';renderForm()">'+l+'</button>').join('');
  document.getElementById('gara').innerHTML = GARA.map(g =>
    '<button class="opt '+(form.garapon===g?'on':'')+'" onclick="form.garapon=\''+g+'\';renderForm()">'+(g||'なし')+'</button>').join('');
  const pl = document.getElementById('plan'), me = document.getElementById('memo');
  if (pl.value !== form.plan) pl.value = form.plan;
  if (me.value !== form.memo) me.value = form.memo;
  document.getElementById('goBtn').textContent = editing ? '変更を保存する' : '来店を記録する';
  document.getElementById('goBtn').classList.toggle('blue', editing);
  document.getElementById('delBtn').style.display = editing ? 'block' : 'none';
}
function row(label,key,type){
  return '<div class="row"><span>'+label+'</span><input '+(type?'type="'+type+'" ':'')+'value="'+esc(form[key])+'" oninput="form.'+key+'=this.value"></div>';
}

/* ---------- 送信 ---------- */
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>el.style.display='none',2200); }
const pending = () => { try { return JSON.parse(localStorage.getItem(PEND_KEY)||'[]'); } catch(e){ return []; } };
const setPending = a => localStorage.setItem(PEND_KEY, JSON.stringify(a));

async function post(obj){
  const r = await fetch(GAS, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(obj) });
  const j = await r.json(); if (!j.ok) throw new Error('NG'); return j;
}

async function submitVisit(){
  if (!staff){ toast('受付した人を選んでください'); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if (!form || !String(form.name).trim()){ toast('お客様のお名前を入れてください'); return; }
  const now = new Date();
  const editing = !!form.id;
  const v = Object.assign({}, form, { action:'fairVisit', name:form.name.trim(),
    id: form.id || ('f'+now.getTime()+Math.random().toString(36).slice(2,6)),
    date: form.date || TODAY, time: form.time || hm(now), staff: form.staff || staff });
  delete v.pend;
  // 先に端末へ保存してから送る（電波が悪くても消えない）
  setPending(pending().filter(p=>p.id!==v.id).concat([v]));
  const i = visits.findIndex(x=>x.id===v.id);
  const shown = Object.assign({pend:true}, v);
  if (i>=0) visits[i] = Object.assign({}, visits[i], shown); else visits.unshift(shown);
  renderList();
  toast('✅ '+v.name+' 様を'+(editing?'変更':'記録')+'しました');
  clearForm();
  sendOne(v);
}
async function sendOne(v){
  try {
    const j = await post(v);
    setPending(pending().filter(p=>p.id!==v.id));
    const x = visits.find(a=>a.id===v.id); if (x){ x.pend=false; if (j.no) x.no=j.no; }
    renderList();
  } catch(e){ /* 端末に残し、30秒ごとに再送 */ }
}
function resendPending(){ pending().forEach(sendOne); }

/* ---------- 一覧 ---------- */
async function loadList(){
  try {
    const list = await (await fetch(GAS+'?action=fairList&date='+TODAY)).json();
    const p = pending().filter(x=>x.date===TODAY);
    const merged = list.map(l => { const q = p.find(x=>x.id===l.id); return q ? Object.assign({}, l, q, {pend:true}) : l; });
    p.filter(x=>!list.some(l=>l.id===x.id)).forEach(x=>merged.push(Object.assign({pend:true}, x)));
    visits = merged.reverse();
  } catch(e){
    visits = pending().filter(x=>x.date===TODAY).map(x=>Object.assign({pend:true},x));
  }
  renderList();
}
function renderList(){
  renderAreas();
  const el = document.getElementById('list');
  if (!visits.length){ el.innerHTML='<div class="msg">まだ記録はありません</div>'; return; }
  el.innerHTML = visits.map((v,i) => {
    const mk = CHKS.filter(([k])=>v[k]).map(([,l])=>'<span class="mk">'+l+'</span>').join('') + (v.garapon?'<span class="mk g">ｶﾞﾗﾎﾟﾝ '+esc(v.garapon)+'</span>':'');
    return '<div class="item'+(isPana(v)?' pa':'')+'" onclick="editVisit('+i+')"><div class="no">'+esc(v.no||'…')+'</div><div class="b">' +
      '<div class="n">'+esc(v.area||'')+'　'+esc(v.name)+' 様'+(cardHolder(v.card) ? panaBadge(v.card) : (v.panaJoin ? '<span class="pana">💳 入会</span>' : ''))+'</div>' +
      '<div class="s">'+esc(v.time)+' 受付 '+esc(v.staff)+(v.plan?'　予定 '+esc(v.plan):'')+'</div>' +
      (mk?'<div>'+mk+'</div>':'') + (v.memo?'<div class="s">'+esc(v.memo)+'</div>':'') +
      (v.pend?'<div class="pend">⏳ 送信待ち（自動で送ります）</div>':'')+'</div></div>';
  }).join('');
}
function editVisit(i){
  const v = visits[i]; if (!v) return;
  form = Object.assign(blank(), v); delete form.pend;
  renderForm(); window.scrollTo({top: document.getElementById('formBox').offsetTop - 10, behavior:'smooth'});
}
async function delVisit(){
  if (!form || !form.id) return;
  const b = document.getElementById('delBtn');
  if (!b.dataset.sure){ b.dataset.sure='1'; b.textContent='もう一度押すと取り消します'; b.style.color='#dc2626';
    setTimeout(()=>{ delete b.dataset.sure; b.textContent='この記録を取り消す'; b.style.color=''; },3000); return; }
  delete b.dataset.sure; b.textContent='この記録を取り消す'; b.style.color='';
  const id = form.id;
  setPending(pending().filter(p=>p.id!==id));
  visits = visits.filter(v=>v.id!==id); renderList(); clearForm();
  try { await post({action:'fairDelete', id}); toast('取り消しました'); } catch(e){ toast('⚠ 取消を送れませんでした'); loadList(); }
}

// 準備（上の定義）がすべて済んでから起動する。PINを覚えていればそのまま開く
if (Number(localStorage.getItem(AUTH_KEY)||0) > Date.now()) start();
</script>
